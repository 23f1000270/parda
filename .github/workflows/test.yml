name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/parda
          key: parda-models-v1
      - name: Fetch models
        run: parda fetch-models
      - name: Run tests
        run: pytest -q
